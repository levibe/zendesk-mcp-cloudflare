# pnpm reads its settings from this file. An equivalent "pnpm" block in
# package.json is silently ignored, so settings belong here.

# Minutes — 10080 is 7 days. pnpm 11 already waits 1 day by default; this
# widens that window, since compromised releases are usually caught and pulled
# within hours. `pnpm install --trust-lockfile` skips the check, but it trusts
# every entry at once, so the targeted exclusion below is preferred.
minimumReleaseAge: 10080

# pnpm turns this on by default once minimumReleaseAge is set explicitly. Stated
# here so the behaviour is visible: when no version satisfies the window, the
# install fails rather than quietly falling back to one that doesn't.
minimumReleaseAgeStrict: true

# Pinned to the exact version rather than the bare package name, which would
# exempt every future release too. Issue #1 upgraded to 0.8.3 (published
# 2026-07-29) while it was still inside the window above, and lockfile
# verification rejects it on a fresh install. Scoped this way the entry expires
# by itself: 0.8.4 goes back through the full wait.
#
# The five below are #40, the move to MCP revision 2026-07-28. The spec and all
# of its implementations were published within a day of each other on 2026-07-27
# and 2026-07-28, so waiting the window out means running a deprecated transport
# for a week rather than avoiding an unvetted release.
#
# Only `server` is imported by this repo. The rest are transitive: `server` pins
# `core` exactly, and `client` and the v1 `sdk` are both auto-installed peers of
# `agents`. The v1 entry is the surprising one and it is not a leftover — `agents`
# still carries the deprecated McpAgent next to the stateless handler, and that
# half is built on v1, so upgrading does not get us off the old SDK. It leaves
# when McpAgent does.
#
# Only exact pins need naming. Two more packages in this tree are also inside the
# window — yargs@18.1.0 and partyserver@0.5.9, both reached through `agents` on a
# caret range — and neither is listed, because pnpm resolves a range to the newest
# version that clears the wait and picks 18.0.0 and 0.5.8 by itself.
#
# `agents` is here for the opposite reason, and it is the trap worth knowing about:
# ^0.20.0 has no member old enough to pass, but asking for `agents@latest` does not
# fail — it quietly resolves to 0.18.0, which predates createMcpHandler entirely.
#
# @levibe/mcp-worker is first-party: 0.2.0 published 2026-08-07 and adopted the same
# day, so no release could clear the window. Exact-pinned, the entry expires by
# itself: 0.2.1 goes back through the full wait.
minimumReleaseAgeExclude:
  - '@levibe/mcp-worker@0.2.0'
  - '@cloudflare/workers-oauth-provider@0.8.3'
  - '@modelcontextprotocol/server@2.0.0'
  - '@modelcontextprotocol/core@2.0.0'
  - '@modelcontextprotocol/client@2.0.0'
  - '@modelcontextprotocol/sdk@1.30.0'
  - 'agents@0.20.1'

# pnpm 11 fails the install outright (ERR_PNPM_IGNORED_BUILDS) unless every
# package with an install script is answered here. The three permitted ones
# normally just fetch or link a prebuilt platform binary — except sharp, which
# falls back to a node-gyp build from source when a global libvips is on the
# machine.
#
# core-js-pure is denied rather than permitted, and it is the one entry here that
# is not a build at all: its postinstall prints a funding notice and swallows its
# own errors, so nothing depends on it having run. It arrived with agents 0.20.1
# in #40, four levels down through mimetext, an email library that has nothing to
# do with MCP.
allowBuilds:
  core-js-pure: false
  esbuild: true
  sharp: true
  workerd: true

# Reinstall when node_modules has drifted from the lockfile, rather than only
# complaining. This repo has no pre-commit hooks, so it is the only local guard.
# `install` rather than `error` because editing minimumReleaseAgeExclude above
# marks node_modules stale, so `error` would fail the next script run with
# ERR_PNPM_VERIFY_DEPS_BEFORE_RUN the moment someone deletes the pinned entry.
verifyDepsBeforeRun: install
